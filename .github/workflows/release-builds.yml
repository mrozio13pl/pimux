name: Release builds

on:
    workflow_dispatch:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    build:
        name: Build ${{ matrix.platform }}
        runs-on: ${{ matrix.platform }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: ubuntu-22.04
                      args: ''
                    - platform: windows-latest
                      args: ''
                    - platform: macos-latest
                      args: --target universal-apple-darwin

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test
              run: pnpm test

            - name: Typecheck
              run: pnpm typecheck

            - name: Build and attach release assets
              id: tauri
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
                  releaseName: Pimux ${{ github.event.release.tag_name || github.ref_name }}
                  releaseBody: See the assets below to download this version and install.
                  releaseDraft: false
                  prerelease: false
                  args: ${{ matrix.args }}

            - name: Upload workflow artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: pimux-${{ runner.os }}
                  path: ${{ steps.tauri.outputs.artifactPaths }}
                  if-no-files-found: error
